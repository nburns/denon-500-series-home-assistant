[project]
name = "denon-500-series"
version = "0.5.6"
description = "Home Assistant integration for Denon AVR-S510BT control over Bluetooth serial"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "dbus-fast>=2",
    "homeassistant>=2026.11",
    "pyobjc-framework-IOBluetooth>=10; sys_platform == 'darwin'",
    "pyright>=1.1.390",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N"]

[tool.pyright]
include = ["custom_components", "tests", "tools"]
typeCheckingMode = "strict"
pythonPlatform = "Linux"

[[tool.pyright.executionEnvironments]]
root = "tools/macos_transport.py"
pythonPlatform = "Darwin"
